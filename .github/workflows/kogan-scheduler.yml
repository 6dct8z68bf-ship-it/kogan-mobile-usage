name: Kogan Scheduler Update

on:
  schedule:
    # Every three hours, deliberately not on the hour: GitHub's scheduler is at
    # its busiest exactly at minute 0, where runs get delayed or even dropped,
    # and the documented advice is to pick a different minute.
    - cron: '17 */3 * * *'
  # Manual runs: Actions -> Usage report -> Run workflow. The inputs apply
  # to that single run and override the repository variables.
  workflow_dispatch:
    inputs:
      months:
        description: 'Usage period to fetch'
        type: choice
        options: ['1', '3', '6']
        default: '6'
      type:
        description: 'Usage type'
        type: choice
        options: ['Data', 'All', 'SMSMMS', 'Calls']
        default: 'Data'
      lang:
        description: 'Report language'
        type: choice
        options: ['en', 'zh']
        default: 'en'

# Nothing is written back to the repository; the report is delivered through the
# Pages site and the workflow artifact.
permissions:
  contents: read

concurrency:
  group: daily-usage-report
  cancel-in-progress: false

jobs:
  report:
    name: Fetch usage and render the report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pages: write is needed by actions/configure-pages to create the Pages site
    # on the first run (enablement: true).
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Cookie handling relies on Headers.getSetCookie(), which needs Node 20+.
          node-version: '22'

      - name: Run the offline test suite
        run: |
          node --version
          node -e "console.log('getSetCookie:', typeof new Headers().getSetCookie)"
          npm test

      # Credentials live in repository secrets and are written to .env only for the
      # duration of the job. Nothing here echoes the values, the file is removed in
      # the always-run step below, and .gitignore already excludes it.
      - name: Write .env from secrets and variables
        env:
          SECRET_ACCOUNTS: ${{ secrets.KOGAN_ACCOUNTS }}
          VAR_LANG: ${{ inputs.lang || vars.KOGAN_LANG }}
          VAR_MONTHS: ${{ inputs.months || vars.KOGAN_MONTHS }}
          VAR_TYPE: ${{ inputs.type || vars.KOGAN_USAGE_TYPE }}
          VAR_MIN_MB: ${{ vars.KOGAN_MIN_MB }}
          VAR_HIGHLIGHT_MB: ${{ vars.KOGAN_HIGHLIGHT_MB }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_ACCOUNTS}" ]; then
            echo "::error::Repository secret KOGAN_ACCOUNTS is not set."
            exit 1
          fi
          umask 077
          # Scheduled runs have no inputs, so the defaults below are what they
          # use. Keep them in step with the workflow_dispatch defaults above.
          # Repository variables of the same name, if set, win over both.
          {
            echo "KOGAN_ACCOUNTS=${SECRET_ACCOUNTS}"
            echo "KOGAN_MONTHS=${VAR_MONTHS:-6}"
            echo "KOGAN_USAGE_TYPE=${VAR_TYPE:-Data}"
            echo "KOGAN_MIN_MB=${VAR_MIN_MB:-1}"
            echo "KOGAN_HIGHLIGHT_MB=${VAR_HIGHLIGHT_MB:-50}"
            echo "KOGAN_MB_BASE=1048576"
            echo "KOGAN_LANG=${VAR_LANG:-en}"
          } > .env
          echo "wrote .env with $(wc -l < .env) settings"

      # Kogan only ever shows a moving window (1, 3 or 6 months), so the day that
      # leaves that window is gone from the site for good. The way out here is a
      # freeze: every five months a copy of the published report is published
      # beside it and is never touched again.
      #
      # The site is rebuilt from scratch on every deploy, so those frozen copies
      # have to be fetched from the live site and handed to the next deploy. If one
      # of them cannot be fetched the run stops before publishing anything, which
      # leaves the site -- and the frozen copies on it -- exactly as they were.
      - name: Restore the frozen reports
        env:
          PAGES_URL: ${{ vars.KOGAN_PAGES_URL }}
        run: |
          set -euo pipefail
          base="${PAGES_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          base="${base%/}/"
          echo "PAGES_BASE=${base}" >> "${GITHUB_ENV}"
          mkdir -p pages/archive

          url="${base}archive/archives.json?t=$(date +%s)"
          code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 3 \
            -o pages/archive/archives.json -w '%{http_code}' "${url}" || echo 000)
          if [ "${code}" = "404" ]; then
            echo "nothing frozen yet; the first freeze falls due five months after the anchor"
            rm -f pages/archive/archives.json
            exit 0
          fi
          if [ "${code}" != "200" ]; then
            echo "::error::cannot read the archive list (HTTP ${code}); nothing is published, so nothing is lost"
            exit 1
          fi

          for file in $(node src/archive-index.js list pages/archive/archives.json); do
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 3 \
              -o "pages/archive/${file}" -w '%{http_code}' "${base}archive/${file}?t=$(date +%s)" || echo 000)
            if [ "${code}" != "200" ]; then
              echo "::error::cannot restore archive/${file} (HTTP ${code}); nothing is published, so nothing is lost"
              exit 1
            fi
            if ! grep -q 'data-report-id' "pages/archive/${file}"; then
              echo "::error::archive/${file} does not look like a report"
              exit 1
            fi
            echo "restored archive/${file}"
          done

      - name: Generate the report
        env:
          LOG_FILE: ${{ runner.temp }}/usage-report.log
          VAR_ARCHIVE_ANCHOR: ${{ vars.KOGAN_ARCHIVE_ANCHOR }}
        run: |
          set -euo pipefail
          mkdir -p out
          # --no-save-raw keeps the fetched pages (which contain full phone numbers)
          # out of the workspace entirely.
          # A redaction flag is mandatory here: this repository is public, so the
          # committed report must never carry a full phone number.
          #   --mask-numbers  -> 040****123      --redact -> Account 1
          # The owner names are treated as public nicknames; add --hide-names if
          # they should not be published either.
          #
          # --archive-dir turns on the freeze: every five months (counted from the
          # anchor) this run also publishes a copy of the report as
          # archive/usage-<date>.html, which is never touched again. Five months
          # against a six month window means each copy reaches a month further back
          # than the previous one ended, so a late run still overlaps.
          node src/index.js --no-save-raw --mask-numbers --out out/usage-report.html \
            --archive-dir pages/archive \
            --base-url "${PAGES_BASE}" \
            --archive-anchor "${VAR_ARCHIVE_ANCHOR:-2026-10-06}" 2>&1 | tee "${LOG_FILE}"

      - name: Upload the report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: usage-report
          path: out/usage-report.html
          retention-days: 30
          if-no-files-found: error

      - name: Remove the generated .env
        if: always()
        run: rm -f .env

      # The report is also published as a web page. Everything that reaches
      # Pages went through a redaction flag, so the site never contains a full
      # phone number.
      - name: Build the Pages site
        run: |
          set -euo pipefail
          mkdir -p pages
          cp out/usage-report.html pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Creates the Pages site on the first run instead of failing.
          enablement: true

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Publish to GitHub Pages
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
