name: Daily usage report

on:
  schedule:
    # 20:00 UTC = 06:00 AEST, or 07:00 while daylight saving is in effect (Sydney).
    - cron: '0 20 * * *'
  # Manual runs: Actions -> Daily usage report -> Run workflow. The inputs apply
  # to that single run and override the repository variables.
  workflow_dispatch:
    inputs:
      months:
        description: 'Usage period to fetch'
        type: choice
        options: ['1', '3', '6']
        default: '1'
      type:
        description: 'Usage type'
        type: choice
        options: ['Data', 'All', 'SMSMMS', 'Calls']
        default: 'Data'
      lang:
        description: 'Report language'
        type: choice
        options: ['en', 'zh']
        default: 'en'

# Only the report is written back, so read/write access to contents is enough.
permissions:
  contents: write

concurrency:
  group: daily-usage-report
  cancel-in-progress: false

jobs:
  report:
    name: Fetch usage and render the report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pages: write is needed by actions/configure-pages when it creates the
    # Pages site for the first time (enablement: true).
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Cookie handling relies on Headers.getSetCookie(), which needs Node 20+.
          node-version: '22'

      - name: Run the offline test suite
        run: |
          node --version
          node -e "console.log('getSetCookie:', typeof new Headers().getSetCookie)"
          npm test

      # Credentials live in repository secrets and are written to .env only for the
      # duration of the job. Nothing here echoes the values, the file is removed in
      # the always-run step below, and .gitignore already excludes it.
      - name: Write .env from secrets and variables
        env:
          SECRET_ACCOUNTS: ${{ secrets.KOGAN_ACCOUNTS }}
          VAR_LANG: ${{ inputs.lang || vars.KOGAN_LANG }}
          VAR_MONTHS: ${{ inputs.months || vars.KOGAN_MONTHS }}
          VAR_TYPE: ${{ inputs.type || vars.KOGAN_USAGE_TYPE }}
          VAR_MIN_MB: ${{ vars.KOGAN_MIN_MB }}
          VAR_HIGHLIGHT_MB: ${{ vars.KOGAN_HIGHLIGHT_MB }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_ACCOUNTS}" ]; then
            echo "::error::Repository secret KOGAN_ACCOUNTS is not set."
            exit 1
          fi
          umask 077
          {
            echo "KOGAN_ACCOUNTS=${SECRET_ACCOUNTS}"
            echo "KOGAN_MONTHS=${VAR_MONTHS:-1}"
            echo "KOGAN_USAGE_TYPE=${VAR_TYPE:-Data}"
            echo "KOGAN_MIN_MB=${VAR_MIN_MB:-1}"
            echo "KOGAN_HIGHLIGHT_MB=${VAR_HIGHLIGHT_MB:-50}"
            echo "KOGAN_MB_BASE=1048576"
            echo "KOGAN_LANG=${VAR_LANG:-en}"
          } > .env
          echo "wrote .env with $(wc -l < .env) settings"

      - name: Generate the report
        env:
          LOG_FILE: ${{ runner.temp }}/usage-report.log
          REPORT_COPY: ${{ runner.temp }}/usage-report.html
        run: |
          set -euo pipefail
          mkdir -p out
          # --no-save-raw keeps the fetched pages (which contain full phone numbers)
          # out of the workspace entirely.
          # A redaction flag is mandatory here: this repository is public, so the
          # committed report must never carry a full phone number.
          #   --mask-numbers  -> 040****123      --redact -> Account 1
          # The owner names are treated as public nicknames; add --hide-names if
          # they should not be published either.
          node src/index.js --no-save-raw --mask-numbers --out out/usage-report.html 2>&1 | tee "${LOG_FILE}"
          # Keep a pristine copy. The commit step rebuilds the branch on top of the
          # newest remote commit, which would otherwise replace this file.
          cp out/usage-report.html "${REPORT_COPY}"

      - name: Upload the report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: usage-report
          path: out/usage-report.html
          retention-days: 30
          if-no-files-found: error

      - name: Commit the report
        env:
          REPORT_COPY: ${{ runner.temp }}/usage-report.html
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Never rebase or merge this file: two runs never produce byte-identical
          # reports (the generation timestamp differs), so replaying a report
          # commit on top of another one always conflicts. Instead, move the
          # branch onto the newest remote commit and drop the fresh report on top,
          # which keeps the history linear and the push a fast-forward.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "${GITHUB_REF_NAME}"
            git reset --mixed FETCH_HEAD
            cp "${REPORT_COPY}" out/usage-report.html
            git add out/usage-report.html

            if git diff --cached --quiet; then
              echo "Report unchanged since the last run; nothing to commit."
              exit 0
            fi

            git commit -m "chore: usage report $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:${GITHUB_REF_NAME}" 2>push-error.txt; then
              echo "Report pushed on attempt ${attempt}."
              rm -f push-error.txt
              exit 0
            fi

            # Branch protection on main rejects pushes from GITHUB_TOKEN. That must
            # not fail the whole run: the report has already been uploaded as an
            # artifact and the Pages deployment still has to happen.
            if grep -qE 'protected branch|GH006' push-error.txt; then
              echo "::warning::${GITHUB_REF_NAME} is protected, so the report could not be committed. The artifact and the GitHub Pages site were still updated. See the README for the options."
              cat push-error.txt
              rm -f push-error.txt
              exit 0
            fi

            cat push-error.txt
            echo "Push rejected because the remote moved; retrying with the newest commit."
            sleep 5
          done

          echo "::error::Could not push the report after 3 attempts."
          exit 1

      - name: Remove the generated .env
        if: always()
        run: rm -f .env

      # The report is also published as a web page. Everything that reaches
      # Pages went through a redaction flag, so the site never contains a full
      # phone number.
      - name: Build the Pages site
        run: |
          set -euo pipefail
          mkdir -p pages
          cp out/usage-report.html pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Creates the Pages site on the first run instead of failing.
          enablement: true

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Publish to GitHub Pages
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
